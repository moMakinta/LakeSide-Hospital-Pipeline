; Copy this to config.ini and change it for your SQL Server.
; config.ini is in .gitignore so passwords don't end up in git.
[sqlserver]
server = localhost
; e.g. localhost\SQLEXPRESS for SQL Server Express
database = LakesideHospital
driver = ODBC Driver 17 for SQL Server
; yes = Windows login. Set to no and fill in the two lines below for a SQL login.
trusted_connection = yes
username =
password =
